name: A bug
description: Something in @ox1audio/sdk doesn't work.
labels: ["bug", "needs triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for telling us. A security problem doesn't belong here: please use [0x1audio.com/security](https://0x1audio.com/security) so it stays private.
  - type: textarea
    id: did
    attributes:
      label: What you did
      description: The steps, so we can do the same.
      placeholder: |
        1. ...
        2. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: textarea
    id: happened
    attributes:
      label: What happened instead
    validations:
      required: true
  - type: input
    id: sdk-version
    attributes:
      label: "@ox1audio/sdk version"
      description: "`npm ls @ox1audio/sdk` prints it."
      placeholder: "0.3.1"
    validations:
      required: true
  - type: input
    id: runtime
    attributes:
      label: Node and Mixel versions
      placeholder: "Node 22.18, Mixel 0.1.23, macOS 15.1"
    validations:
      required: true
  - type: dropdown
    id: part
    attributes:
      label: Which part
      options:
        - A page inside Mixel (@ox1audio/sdk/page)
        - Scripts (@ox1audio/sdk/local)
        - The cloud client
        - Types
        - Not sure
    validations:
      required: true
  - type: textarea
    id: log
    attributes:
      label: Error text
      description: The full error and its code. Remove anything private, such as folder names.
      render: text
